version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: django/Dockerfile

    volumes:
      - ./django:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=coffee_shop.settings.dev
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - DATABASE_URL=${DATABASE_URL:-postgresql://coffee_shop:change-me-dev@db:5432/coffee_shop_dev}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - YANDEX_OAUTH_CLIENT_ID=${YANDEX_OAUTH_CLIENT_ID:-}
      - YANDEX_OAUTH_CLIENT_SECRET=${YANDEX_OAUTH_CLIENT_SECRET:-}
      - YANDEX_OAUTH_REDIRECT_URI=${YANDEX_OAUTH_REDIRECT_URI:-http://localhost:8000/accounts/oauth/complete/yandex/}
      - YANDEX_MAPS_API_KEY=${YANDEX_MAPS_API_KEY:-}
      - YANDEX_JAVASCRIPT_API_KEY=${YANDEX_JAVASCRIPT_API_KEY:-}
      - YANDEX_GEOCODER_API_KEY=${YANDEX_GEOCODER_API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-available/coffee.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/usr/share/nginx/html/static:ro
      - media_data:/usr/share/nginx/html/media:ro
      - certbot_www:/var/www/certbot
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coffee_shop_dev}
      POSTGRES_USER: ${POSTGRES_USER:-coffee_shop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coffee_shop} -d ${POSTGRES_DB:-coffee_shop_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery-worker:
    build:
      context: .
      dockerfile: django/Dockerfile
    command: celery -A coffee_shop worker -l info
    volumes:
      - ./django:/app
      - media_data:/app/media
    environment:
      - DJANGO_SETTINGS_MODULE=coffee_shop.settings.dev
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key}
      - DATABASE_URL=${DATABASE_URL:-postgresql://coffee_shop:change-me-dev@db:5432/coffee_shop_dev}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - YANDEX_OAUTH_CLIENT_ID=${YANDEX_OAUTH_CLIENT_ID:-}
      - YANDEX_OAUTH_CLIENT_SECRET=${YANDEX_OAUTH_CLIENT_SECRET:-}
      - YANDEX_MAPS_API_KEY=${YANDEX_MAPS_API_KEY:-}
      - YANDEX_JAVASCRIPT_API_KEY=${YANDEX_JAVASCRIPT_API_KEY:-}
      - YANDEX_GEOCODER_API_KEY=${YANDEX_GEOCODER_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A coffee_shop inspect ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    volumes:
      - /etc/letsencrypt
      - certbot_www:/var/www/certbot
    restart: unless-stopped

volumes:
  pgdata:
  static_data:
  media_data:
  redis_data:
  certbot_www:

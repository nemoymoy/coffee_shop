{% extends 'base.html' %}

{% block title %}Email подтверждён — Coffee Shop{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
            <div class="card-body p-5 text-center">
                <div class="mb-4">
                    <span style="font-size: 4rem;">✅</span>
                </div>
                <h2 class="mb-3">Email успешно подтверждён!</h2>
                <p class="text-muted mb-4">
                    Теперь у вас доступен весь функционал сайта: добавление товаров в корзину,
                    оформление заказов и многое другое.
                </p>
                <a href="{% url 'catalog:catalog' %}" class="btn btn-coffee btn-lg">
                    Перейти в каталог
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
